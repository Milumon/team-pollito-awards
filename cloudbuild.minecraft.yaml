steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull "${_IMAGE}:latest" || true
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_SUPABASE_ANON_KEY}" \
          --build-arg SUPABASE_SERVICE_ROLE_KEY="${_SUPABASE_SERVICE_ROLE_KEY}" \
          --build-arg NEXT_PUBLIC_VOTING_PHASE="${_VOTING_PHASE}" \
          --cache-from "${_IMAGE}:latest" \
          -t "${_IMAGE}:${_TAG}" \
          -t "${_IMAGE}:latest" \
          .
        docker push "${_IMAGE}:${_TAG}"
        docker push "${_IMAGE}:latest"
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest
options:
  logging: GCS_ONLY
